version: 1
frontend:
  phases:
    preBuild:
      commands:
        - yarn install
        - echo "DATABASE_URI=\"$DATABASE_URI\"" >> .env
        - echo "DATABASE_SSL_CA_PATH=\"$DATABASE_SSL_CA_PATH\"" >> .env
        - echo "PAYLOAD_SECRET=\"$PAYLOAD_SECRET\"" >> .env
        # Add S3 variables if you are using them:
        - echo "S3_BUCKET=\"$S3_BUCKET\"" >> .env
        - echo "S3_ACCESS_KEY_ID=\"$S3_ACCESS_KEY_ID\"" >> .env
        - echo "S3_SECRET_ACCESS_KEY=\"$S3_SECRET_ACCESS_KEY\"" >> .env
        - echo "S3_REGION=\"$S3_REGION\"" >> .env
        - echo "S3_ENDPOINT=\"$S3_ENDPOINT\"" >> .env
        - echo "CONTACT_EMAIL=\"$CONTACT_EMAIL\"" >> .env
        - echo "CONTACT_EMAIL_CC=\"$CONTACT_EMAIL_CC\"" >> .env
        - echo "SMTP_HOST=\"$SMTP_HOST\"" >> .env
        - echo "SMTP_PORT=\"$SMTP_PORT\"" >> .env
        - echo "SMTP_USER=\"$SMTP_USER\"" >> .env
        - echo "SMTP_PASS=\"$SMTP_PASS\"" >> .env
        - echo "GMAIL_CLIENT_ID=\"$GMAIL_CLIENT_ID\"" >> .env
        - echo "GMAIL_CLIENT_SECRET=\"$GMAIL_CLIENT_SECRET\"" >> .env
        - echo "GMAIL_REFRESH_TOKEN=\"$GMAIL_REFRESH_TOKEN\"" >> .env
        - echo "NEXT_PUBLIC_RECAPTCHA_SITE_KEY=\"$NEXT_PUBLIC_RECAPTCHA_SITE_KEY\"" >> .env
        - echo "RECAPTCHA_SECRET_KEY=\"$RECAPTCHA_SECRET_KEY\"" >> .env
        - echo "NEXT_PUBLIC_SERVER_URL=\"$NEXT_PUBLIC_SERVER_URL\"" >> .env
        - echo "NEXT_PUBLIC_S3_MEDIA_URL=\"$NEXT_PUBLIC_S3_MEDIA_URL\"" >> .env
        - echo "NEXT_PUBLIC_PROMO_VIDEO_URL=\"$NEXT_PUBLIC_PROMO_VIDEO_URL\"" >> .env
        - echo "SERVER_URL=\"$SERVER_URL\"" >> .env
    build:
      commands:
        - yarn run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
